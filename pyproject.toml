[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "purchase-torob-agent-core"
version = "0.2.0"
description = "Python agent core for in-person shopping discovery in Tehran"
requires-python = ">=3.11"
dependencies = [
  "langchain-core>=1.1,<2",
  "langgraph>=1.0,<2",
  "openai>=1.68,<3",
  "pydantic>=2.7,<3",
  "python-dotenv>=1.1,<2",
  "httpx>=0.27,<1",
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
]

[project.scripts]
torob-chat = "src.cli.chat:main"
torob-evals = "src.scripts.evals:main"

[tool.setuptools.packages.find]
include = ["src*"]

[tool.pytest.ini_options]
pythonpath = ["."]
